services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: law
      POSTGRES_USER: law
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - law_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law -d law"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  law_postgres:
