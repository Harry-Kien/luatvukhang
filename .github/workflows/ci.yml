name: CI

# Chạy trên mọi lần đẩy vào main và mọi pull request. Website của một công ty
# luật thì lỗi lọt ra bản chạy thật tốn kém hơn nhiều so với vài phút chờ CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Đẩy liên tiếp thì huỷ lần chạy cũ, chỉ giữ kết quả của mã mới nhất.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kiểm tra kiểu, dựng bản build và chạy kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: law
          POSTGRES_PASSWORD: law-ci-password
          POSTGRES_DB: law
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U law"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://law:law-ci-password@localhost:5434/law
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Bản CI chạy ở chế độ minh họa và chưa duyệt ra mắt, giống bản phát
      # triển: kiểm thử đối chiếu đúng trạng thái mà website đang ở.
      NEXT_PUBLIC_DEMO_MODE: "true"
      SITE_LAUNCH_APPROVED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Sinh khóa bí mật dùng riêng cho lần chạy này
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Kiểm tra bản dịch
        run: npm run check:translations

      - name: Tạo lược đồ cơ sở dữ liệu
        run: |
          npm run payload -- migrate
          psql "$DATABASE_URL" -f scripts/init-rate-limit.sql

      - name: Dựng bản production
        run: npm run build

      - name: Tạo tài khoản quản trị cho kiểm thử
        run: node --import tsx scripts/bootstrap.ts

      - name: Nạp các trang nền
        # Bước cài đặt ghi trong README. Kiểm thử đối chiếu một bản cài đặt đã
        # khởi tạo đúng cách, không phải một cơ sở dữ liệu trống.
        run: node --import tsx scripts/prepare-pages.ts

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Khởi động máy chủ và chờ sẵn sàng
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/server.log 2>&1 &
          ready=""
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/vi; then
              ready=1
              echo "May chu san sang sau ${i}s"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "May chu khong len sau 90 giay. Log:"
            cat /tmp/server.log
            exit 1
          fi

      - name: Chạy kiểm thử
        run: npx playwright test

      - name: Kiểm tra nội dung và tiếp cận trên ba ngôn ngữ
        run: npm run check:content

      - name: Lưu báo cáo khi kiểm thử hỏng
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
