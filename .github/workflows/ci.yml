name: CI

# Chạy trên mọi lần đẩy vào main và mọi pull request. Website của một công ty
# luật thì lỗi lọt ra bản chạy thật tốn kém hơn nhiều so với vài phút chờ CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Đẩy liên tiếp thì huỷ lần chạy cũ, chỉ giữ kết quả của mã mới nhất.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kiểm tra kiểu, dựng bản build và chạy kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # SQLite là một tệp trên đĩa: CI không cần dựng dịch vụ cơ sở dữ liệu nào.
      DATABASE_URL: file:./.local/law.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Bản CI chạy ở chế độ minh họa và chưa duyệt ra mắt, giống bản phát
      # triển: kiểm thử đối chiếu đúng trạng thái mà website đang ở.
      NEXT_PUBLIC_DEMO_MODE: "true"
      SITE_LAUNCH_APPROVED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Sinh khóa bí mật dùng riêng cho lần chạy này
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Kiểm tra bản dịch
        run: npm run check:translations

      - name: Tạo lược đồ cơ sở dữ liệu
        run: |
          npm run payload -- migrate
          node -e "import('@libsql/client').then(async m=>{const fs=await import('node:fs');const c=m.createClient({url:process.env.DATABASE_URL});await c.execute(fs.readFileSync('scripts/init-rate-limit.sql','utf8'))})"

      - name: Dựng bản production
        run: npm run build

      - name: Tạo tài khoản quản trị cho kiểm thử
        run: node --import tsx scripts/bootstrap.ts

      - name: Nạp các trang nền
        # Bước cài đặt ghi trong README. Kiểm thử đối chiếu một bản cài đặt đã
        # khởi tạo đúng cách, không phải một cơ sở dữ liệu trống.
        run: node --import tsx scripts/prepare-pages.ts

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Khởi động máy chủ và chờ sẵn sàng
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/server.log 2>&1 &
          ready=""
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/vi; then
              ready=1
              echo "May chu san sang sau ${i}s"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "May chu khong len sau 90 giay. Log:"
            cat /tmp/server.log
            exit 1
          fi

      - name: Chạy kiểm thử
        run: npx playwright test

      - name: Kiểm tra nội dung và tiếp cận trên ba ngôn ngữ
        run: npm run check:content

      - name: Kiểm tra tệp khởi động cho hosting Passenger
        # server.js là đường vào cho hosting cPanel, nơi Passenger nạp thẳng một
        # tệp JavaScript chứ không chạy "npm start". Không ai chạy nó hằng ngày,
        # nên nếu không kiểm ở đây thì nó hỏng lúc nào không biết — và chỉ lộ ra
        # đúng lúc đang triển khai.
        run: |
          NODE_ENV=production PORT=3100 node server.js > /tmp/passenger.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/api/health/ready; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "server.js khong len sau 60 giay. Log:"
            cat /tmp/passenger.log
            exit 1
          fi
          for path in /vi /vi/services /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "server.js tra $code cho $path"; exit 1; }
          done

      - name: Kiểm tra gói tải lên hosting đủ tệp
        # Nhà cung cấp từng báo "bộ mã nguồn chưa đầy đủ". Bước này dựng đúng
        # gói sẽ tải lên và đối chiếu danh sách tệp bắt buộc, để việc xóa nhầm
        # một tệp cấu hình lộ ra ở đây chứ không phải giữa lúc triển khai.
        run: npm run bundle:hosting

      - name: Lưu báo cáo khi kiểm thử hỏng
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Dựng ảnh Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Dựng ảnh
        # Chỉ dựng, không đẩy đi đâu. Mục đích là bảo đảm Dockerfile luôn dựng
        # được, để lúc cần triển khai không phát hiện hỏng giữa chừng.
        run: docker build --build-arg NEXT_PUBLIC_DEMO_MODE=false -t luatvukhang:ci .

      - name: Kiểm tra ảnh chạy được và không dùng quyền root
        run: |
          user=$(docker run --rm luatvukhang:ci id -un)
          echo "Container chay bang nguoi dung: $user"
          [ "$user" = "node" ] || { echo "Phai chay bang nguoi dung node"; exit 1; }
          docker run --rm luatvukhang:ci node -e "require('sharp');console.log('sharp nap duoc trong anh')"
